<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sungrow SH5.0RS</title>
  <script type="module" src="/datastar.js"></script> <!-- Datastar v1.0.1, vendored in. -->
  <style>
    :root {
      font-size: 19px;          /* base scale — everything is rem-based, so this enlarges the whole UI */
      --bg: #d2d2cd;
      --card: #ffffff;
      --ink: #000000;
      --muted: #2e2d29;
      --faint: #514f48;
      --line: #9b9890;
      --accent: #a85e0a;       /* solar ochre, darkened for contrast on white */
      --pos: #156b39;          /* export / discharge */
      --neg: #b22d18;          /* import / charge */
      --pos-bg: rgba(21,107,57,.13);
      --neg-bg: rgba(178,45,24,.13);
      --ok-bg: #d6ecdc;  --ok-ink: #0e4a26;
      --err-bg: #f6dcd5; --err-ink: #7e200e;
      --warn-bg: #f4e1b6; --warn-ink: #5f3c05;
      --cmd-bg: #dbe4ec; --cmd-ink: #243d50;
      --mute-bg: #e3e1da;
      --soc-yday: #2d56a8;     /* yesterday's SOC line — distinct from today's ochre */
      --radius: 4px;
      --shadow: 0 1px 0 rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.10);
      --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Code", Menlo, Consolas, monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 1.75rem 1rem 4rem;
      background: var(--bg); color: var(--ink);
      font-family: var(--sans); line-height: 1.5;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    .wrap { max-width: 30rem; margin: 0 auto; }

    header {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 1rem; margin: 0 .25rem 1.5rem;
    }
    h1 { margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: -.015em; }
    .clock {
      display: flex; align-items: center; gap: .45rem;
      font-family: var(--mono); font-size: .8rem; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .live-dot {
      width: .5rem; height: .5rem; border-radius: 50%; background: var(--pos);
      animation: pulse 2.4s ease-out infinite;
    }
    .clock.stale .live-dot { background: var(--neg); animation: none; }
    .clock.stale #clock { color: var(--faint); }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(21,107,57,.45); }
      70%  { box-shadow: 0 0 0 .45rem rgba(21,107,57,0); }
      100% { box-shadow: 0 0 0 0 rgba(21,107,57,0); }
    }

    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 1.1rem 1.2rem; margin-bottom: 1rem;
      animation: rise .5s cubic-bezier(.2,.7,.2,1) both;
    }
    .card:nth-of-type(2) { animation-delay: .05s; }
    .card:nth-of-type(3) { animation-delay: .10s; }
    .card:nth-of-type(4) { animation-delay: .15s; }
    .card:nth-of-type(5) { animation-delay: .20s; }
    .card:nth-of-type(6) { animation-delay: .25s; }
    .card:nth-of-type(7) { animation-delay: .30s; }
    .card:nth-of-type(8) { animation-delay: .35s; }
    .card:nth-of-type(9) { animation-delay: .40s; }
    .card:nth-of-type(10) { animation-delay: .45s; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    .card h2 {
      margin: 0 0 .9rem; padding-bottom: .45rem; font-size: .76rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .09em; color: var(--ink);
      border-bottom: 1px solid var(--line);
    }

    /* forecast */
    .fc-day + .fc-day { margin-top: .65rem; padding-top: .65rem; border-top: 1px solid var(--line); }
    .fc-head { display: flex; justify-content: space-between; align-items: baseline; }
    .fc-label { font-size: .92rem; color: var(--muted); }
    .fc-kwh { font-family: var(--mono); font-size: 1.25rem; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .fc-sub { font-size: .76rem; color: var(--faint); }
    .fc-badge {
      display: inline-block; margin-left: .3rem; padding: 0 .35rem; border-radius: 3px;
      background: var(--warn-bg); color: var(--warn-ink); font-family: var(--sans);
      font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; vertical-align: middle;
    }
    .spark {
      display: block; width: 100%; height: 40px; margin: .35rem 0 .15rem;
      background: #fafaf7; border: 1px solid var(--line); border-radius: 2px;
    }
    .spark-area { fill: var(--pos-bg); }
    .spark-line { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
    .spark-now { stroke: var(--ink); stroke-width: 1; opacity: .55; vector-effect: non-scaling-stroke; stroke-dasharray: 2 2; }
    .spark-actual { fill: none; stroke: var(--pos); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
    .fc-actual { color: var(--pos); }
    .fc-legend { display: flex; align-items: center; gap: .35rem; font-size: .74rem; color: var(--muted); margin-top: .1rem; }
    .fc-legend .lg { width: .9rem; border-top: 3px solid; }
    .fc-legend .lg-fc { border-color: var(--accent); }
    .fc-legend .lg-ac { border-color: var(--pos); margin-left: .55rem; }

    /* battery SOC history */
    .soc-chart {
      display: block; width: 100%; height: 80px; margin: .35rem 0 .15rem;
      background: #fafaf7; border: 1px solid var(--line); border-radius: 2px;
    }
    .soc-grid { stroke: var(--line); stroke-width: 1; opacity: .55; vector-effect: non-scaling-stroke; stroke-dasharray: 3 3; }
    .soc-today { fill: none; stroke: var(--accent); stroke-width: 2.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
    .soc-yday { fill: none; stroke: var(--soc-yday); stroke-width: 1.75; stroke-dasharray: 5 3; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
    .fc-legend .lg-soc-td { border-color: var(--accent); }
    .fc-legend .lg-soc-yd { border-color: var(--soc-yday); border-top-style: dashed; margin-left: .55rem; }

    /* forecast vs actual table */
    .cmp { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .cmp th { padding: .2rem .3rem; text-align: right; font-weight: 700; font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 1px solid var(--ink); }
    .cmp th:first-child { text-align: left; }
    .cmp td { padding: .32rem .3rem; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); }
    .cmp td:first-child { text-align: left; font-family: var(--sans); color: var(--muted); }
    .cmp-act { color: var(--pos); }
    .cmp-ratio { color: var(--faint); }

    /* live stats */
    .stale-banner {
      background: var(--err-bg); color: var(--err-ink); border: 1px solid var(--err-ink);
      border-radius: var(--radius); padding: .45rem .6rem; margin-bottom: .75rem;
      font-size: .82rem; font-weight: 600;
    }
    .metrics { display: flex; flex-direction: column; gap: .35rem; }
    .metric {
      display: grid; grid-template-columns: 1fr auto auto; align-items: baseline; gap: .55rem;
      padding: .4rem .55rem; margin: 0 -.55rem; border-radius: 4px;
      transition: background .3s ease, box-shadow .3s ease;
    }
    .metric.tint-pos { background: var(--pos-bg); box-shadow: inset 3px 0 0 var(--pos); }
    .metric.tint-neg { background: var(--neg-bg); box-shadow: inset 3px 0 0 var(--neg); }
    .m-label { color: var(--muted); font-size: .92rem; }
    .m-val {
      justify-self: end; font-family: var(--mono); font-size: 1.15rem;
      font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    }
    .m-unit { margin-left: .15rem; font-size: .74rem; color: var(--faint); }
    .m-dir { justify-self: end; min-width: 5.2rem; text-align: right; font-size: .72rem; color: var(--muted); }
    .pos { color: var(--pos); } .neg { color: var(--neg); }

    .soc { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); }
    .soc-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .5rem; }
    .soc-pct { font-family: var(--mono); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .bar { height: .55rem; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), #d18a2a); transition: width .6s cubic-bezier(.4,0,.2,1); }

    /* control state */
    .pills { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .55rem; }
    .pill { font-size: .77rem; font-weight: 600; padding: .2rem .6rem; border-radius: 99px; line-height: 1.45; border: 1px solid transparent; }
    .pill-warn  { background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-ink); }
    .pill-ok    { background: var(--ok-bg);   color: var(--ok-ink);   border-color: var(--ok-ink); }
    .pill-muted { background: var(--mute-bg); color: var(--muted);    border-color: var(--line); }
    .pill-cmd   { background: var(--cmd-bg);  color: var(--cmd-ink);  border-color: var(--cmd-ink); }
    .pill-power { font-family: var(--mono); border-color: var(--line); color: var(--ink); }
    .ago { margin: .15rem 0 0; font-size: .77rem; color: var(--faint); }
    .ago.stale { color: var(--neg); }

    /* mode */
    .mode-line { display: flex; align-items: center; gap: .5rem; font-size: .92rem; }
    .mode-line strong { font-weight: 600; }
    .dot { flex: none; width: .5rem; height: .5rem; border-radius: 50%; background: var(--faint); }
    .dot-on { background: var(--accent); }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: .3rem .9rem; margin: .8rem 0 0; font-size: .85rem; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; justify-self: end; font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .note { margin: .55rem 0 0; font-size: .82rem; color: var(--faint); }

    /* actions */
    .actions { display: flex; flex-direction: column; gap: .6rem; }
    .row { display: flex; gap: .5rem; }
    button, select {
      font: inherit; border-radius: 4px; border: 1px solid var(--faint);
      background: var(--card); color: var(--ink); padding: .62rem .9rem;
    }
    button { font-weight: 550; cursor: pointer; transition: transform .08s ease, box-shadow .15s ease, background .15s ease; }
    button:hover { box-shadow: var(--shadow); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .55; cursor: progress; box-shadow: none; transform: none; }
    .btn-primary { flex: 1; background: var(--ink); color: #fff; border-color: var(--ink); }
    .btn-primary:hover { background: #000; }
    .btn-ghost { width: 100%; }
    .btn-stop { width: 100%; background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-ink); }
    .btn-stop:hover { background: #edd69f; }
    .actions .expiry { display: flex; flex-direction: column; gap: .25rem; font-size: .76rem; color: var(--muted); }
    .actions .expiry .expiry-input { display: flex; align-items: center; gap: .4rem; align-self: flex-start; }
    .actions .expiry input {
      font: inherit; font-family: var(--mono); border: 1px solid var(--faint);
      border-radius: 4px; padding: .5rem .6rem; background: var(--card); color: var(--ink);
    }
    .expiry-clear {
      flex: none; width: 1.7rem; height: 1.7rem; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.05rem; line-height: 1; font-weight: 400;
      border-radius: 50%; border: 1px solid var(--line);
      background: var(--card); color: var(--muted);
    }
    .expiry-clear:hover { background: var(--neg-bg); color: var(--neg); border-color: transparent; box-shadow: none; }
    select { color: var(--ink); font-variant-numeric: tabular-nums; }

    /* schedule editor */
    .sched { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem .9rem; }
    .sched label { display: flex; flex-direction: column; gap: .25rem; font-size: .78rem; color: var(--muted); }
    .sched input, .sched select {
      font: inherit; font-family: var(--mono); font-variant-numeric: tabular-nums;
      border: 1px solid var(--faint); border-radius: 4px; padding: .5rem .6rem;
      background: var(--card); color: var(--ink);
    }
    .sched input:focus-visible, .sched select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    .sched .row { grid-column: 1 / -1; margin-top: .15rem; }
    .sched .btn-preset {
      grid-column: 1 / -1; justify-self: start;
      font-size: .76rem; color: var(--muted);
      padding: .3rem .7rem; border-radius: 99px;
    }

    .alert { margin-top: .55rem; padding: .55rem .8rem; border-radius: 4px; font-size: .85rem; border: 1px solid; }
    .alert-ok  { background: var(--ok-bg);  color: var(--ok-ink);  border-color: var(--ok-ink); }
    .alert-err { background: var(--err-bg); color: var(--err-ink); border-color: var(--err-ink); }
    .empty { margin: 0; color: var(--faint); font-size: .9rem; }

    /* control write audit table */
    #control-writes { max-height: 18rem; overflow: auto; -webkit-overflow-scrolling: touch; }
    /* Fixed layout so a long error line wraps at the card width instead of
       widening the table into a horizontal scroll. */
    .cw { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: .8rem; }
    .cw th:first-child { width: 7.4rem; }  /* fits "12 Jun 11:30:02" in the mono size */
    .cw th:last-child { width: 3.8rem; }   /* fits the result pill */
    .cw th {
      padding: .2rem .3rem; text-align: left; font-weight: 700;
      font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
      position: sticky; top: 0; background: var(--card);
      box-shadow: inset 0 -1px 0 var(--ink);
    }
    .cw th:last-child { text-align: right; }
    .cw td { padding: .32rem .3rem; border-top: 1px solid var(--line); vertical-align: baseline; }
    .cw td:first-child {
      font-family: var(--mono); font-variant-numeric: tabular-nums;
      font-size: .72rem; color: var(--ink); white-space: nowrap;
    }
    .cw td:last-child { text-align: right; }
    .cw-arrow { margin: 0 .3rem; color: var(--faint); }
    .cw-pill { font-size: .68rem; font-weight: 500; padding: .1rem .45rem; border-radius: 99px; white-space: nowrap; }
    .cw-ok   { background: var(--ok-bg);   color: var(--ok-ink); }
    .cw-noop { background: var(--mute-bg); color: var(--muted); }
    .cw-fail { background: var(--err-bg);  color: var(--err-ink); }
    .cw-err td {
      border-top: none; padding-top: 0;
      font-family: var(--mono); font-size: .7rem; color: var(--err-ink);
      overflow-wrap: anywhere;
    }

    /* raw diagnostics */
    .diag {
      margin: 0; max-height: 22rem; overflow: auto;
      font-family: var(--mono); font-size: .72rem; line-height: 1.45;
      color: var(--ink); background: #fafaf7;
      border: 1px solid var(--line); border-radius: 4px; padding: .7rem .8rem;
      white-space: pre; -webkit-overflow-scrolling: touch;
    }
  </style>
</head>

<body data-init="@get('/ui/updates')">
  <div class="wrap">
    <header>
      <h1>Sungrow SH5.0RS</h1>
      <div class="clock"
           data-signals="{tickMs: 0, seenAt: 0, stale: false}"
           data-init="$seenAt = Date.now()"
           data-on-signal-patch="$seenAt = Date.now()"
           data-on-signal-patch-filter="{include: /^tickMs$/}"
           data-on-interval="$stale = Date.now() - $seenAt > 3000"
           data-class:stale="$stale"><span class="live-dot"></span><span id="clock">connecting…</span></div>
    </header>

    <section class="card">
      <h2>PV forecast</h2>
      <div id="forecast"><p class="empty">loading…</p></div>
    </section>

    <section class="card">
      <h2>Forecast vs actual</h2>
      <div id="compare"><p class="empty">loading…</p></div>
    </section>

    <section class="card">
      <h2>Live</h2>
      <div id="stats"><p class="empty">loading…</p></div>
    </section>

    <section class="card">
      <h2>Battery SOC</h2>
      <div id="soc-history"><p class="empty">loading…</p></div>
    </section>

    <section class="card">
      <h2>Control state</h2>
      <div id="status"><p class="empty">loading…</p></div>
    </section>

    <section class="card">
      <h2>Mode</h2>
      <div id="mode"><p class="empty">loading…</p></div>
    </section>

    <section class="card">
      <h2>Schedule</h2>
      <div class="sched">
        <label>Start
          <input type="time" data-bind:schedule-start>
        </label>
        <label>End
          <input type="time" data-bind:schedule-end>
        </label>
        <button type="button" class="btn-preset"
                data-on:click="$scheduleStart='00:00';$scheduleEnd='06:00'">⚡EV hours 00:00–06:00</button>
        <label>Mode
          <select data-bind:schedule-mode>
            <option value="fixed">Fixed rate</option>
            <option value="adaptive">Adaptive grid cap</option>
          </select>
        </label>
        <label data-show="$scheduleMode !== 'adaptive'">Rate (kW)
          <input type="number" min="0.1" max="{{.MaxKW}}" step="0.1" data-bind:schedule-kw>
        </label>
        <label data-show="$scheduleMode === 'adaptive'">Grid import cap (A)
          <input type="number" min="1" max="{{.FuseA}}" step="0.5" data-bind:schedule-cap-a>
        </label>
        <label>Max SOC (%)
          <input type="number" min="1" max="100" step="1" data-bind:schedule-soc>
        </label>
        <div class="row">
          <button class="btn-primary"
                  data-on:click="@post('/ui/action/schedule')"
                  data-indicator="savingSched"
                  data-attr:disabled="$savingSched">Save schedule</button>
          <button class="btn-ghost"
                  data-on:click="@post('/ui/action/schedule-disable')"
                  data-indicator="disablingSched"
                  data-attr:disabled="$disablingSched">Disable</button>
        </div>
      </div>
      <div id="schedule-result"></div>
    </section>

    <section class="card">
      <h2>Actions</h2>
      <div class="actions">
        <div class="row">
          <button class="btn-primary"
                  data-on:click="@post('/ui/action/force-charge')"
                  data-indicator="charging"
                  data-attr:disabled="$charging">⚡Force charge</button>
          <select data-bind:charge-rate-kw aria-label="charge rate (kW)">
            <option value="1.0">1.0 kW</option>
            <option value="1.5">1.5 kW</option>
            <option value="2.0">2.0 kW</option>
          </select>
        </div>
        <button class="btn-stop"
                data-on:click="@post('/ui/action/stop')"
                data-indicator="stopping"
                data-attr:disabled="$stopping">⏹ Stop battery</button>
        <label class="expiry">Auto-clear at (optional — applies to Force charge &amp; Stop)
          <span class="expiry-input">
            <input type="time" data-bind:override-expiry>
            <button type="button" class="expiry-clear" aria-label="Clear auto-clear time"
                    data-show="$overrideExpiry"
                    data-on:click="$overrideExpiry=''">×</button>
          </span>
        </label>

        <button class="btn-ghost"
                data-on:click="@post('/ui/action/resume')"
                data-indicator="resuming"
                data-attr:disabled="$resuming">↺ Resume schedule</button>
      </div>
      <div id="action-result"></div>
    </section>

    <section class="card">
      <h2>Control writes</h2>
      <div id="control-writes"><p class="empty">loading…</p></div>
    </section>

    <section class="card">
      <h2>Diagnostics (raw)</h2>
      <pre id="diag" class="diag">loading…</pre>
    </section>
  </div>
</body>
</html>
